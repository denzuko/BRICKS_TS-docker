# bricks web routes — URIMAP-equivalent. One row per route.
#
# Format: METHOD  PATH-PATTERN  TRANSID  [groups[,groups...]]  [response_timeout]
#
# - METHOD is one of GET POST PUT DELETE PATCH HEAD OPTIONS.
# - PATH-PATTERN accepts {name} placeholders. Each capture is exposed
#   to the transaction via `EXEC CICS WEB READ QUERYPARM('name')`
#   alongside any `?name=...` query string parameters.
# - TRANSID is the bricks transaction to dispatch on a match.
#   Must be 4 characters; must exist in transactions.conf.
# - groups is comma-separated and gates the route via Basic-Auth.
#   Opt-in ACL: a row with no groups column denies every request.
#   The literal group `public` allows unauthenticated callers; any
#   other group requires an authenticated user with that group.
# - response_timeout overrides web_request_timeout for this route
#   (Go duration syntax: 5s, 250ms, 1m).

GET   /api/customer/{id}   WAPI   public

# ── URIMAP entries — named outbound endpoints ───────────────────────
# A URIMAP row defines a named upstream service that outbound CICS
# programs reference via:
#
#     EXEC CICS WEB OPEN URIMAP('GITHUB') SESSTOKEN(...) END-EXEC.
#
# The program then issues WEB SEND / WEB CONVERSE against PATHs
# that are concatenated onto the URIMAP's path-prefix (if any).
# Centralising the host/port/scheme here lets an operator re-target
# a whole fleet of programs by editing one row instead of every .cob
# or .rexx file.
#
# Format: URIMAP NAME scheme://host[:port][/path-prefix]
# NAME must be 1..8 uppercase characters (CICS resource-name limits).
URIMAP   GITHUB   https://api.github.com

# ── Adding more applications ────────────────────────────────────────
# bricks is NOT hard-wired to a single route. Every web application
# is one row here pointing at a 4-character TRANSID; the TRANSID is
# then resolved to a program file via transactions.conf, exactly the
# way a 3270 operator's typed dispatch works. Add hundreds of routes
# if you need them — the file reloads on mtime change, so new rows
# go live without a bricks restart.
#
# A few illustrative shapes (uncomment + add the matching
# transactions.conf row + drop the program file under runtime/rexx
# or runtime/cobol to activate):
#
#  REST GET on a different resource → REXX handler
# GET    /api/orders/{id}    OAPI   users
#
#  REST POST (form body via WEB READ FORMFIELD or raw JSON via
#  WEB RECEIVE) → COBOL handler. `admin` means Basic-Auth required.
# POST   /api/customer       WAPC   admin
#
#  Admin endpoint with a per-route timeout override (5 seconds
#  instead of the default web_request_timeout) → COBOL handler.
# DELETE /admin/cache/{key}  CACR   admin    5s
#
#  Public health probe with no path captures → any tiny REXX program
#  that emits `{"ok":true}` via WEB SEND.
# GET    /api/health         HLTH   public   3s
